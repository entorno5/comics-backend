# ============================================================
# Mock profile — runs WITHOUT a real MongoDB instance
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=mock
# ============================================================

spring.application.name=comics [MOCK]

# Exclude all MongoDB auto-configuration
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# Log at DEBUG level to see mock data being loaded
logging.level.com.comics.backend.mock=DEBUG
