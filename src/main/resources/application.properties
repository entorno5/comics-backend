# ============================================================
# Comics Backend Application Configuration
# ============================================================

# Application Info
spring.application.name=comics
spring.application.version=1.0.0

# ============================================================
# MongoDB Configuration
# ============================================================
spring.data.mongodb.uri=mongodb://192.168.0.20:27017/testComics

# Enable MongoDB Auditing
spring.data.mongodb.auto-index-creation=true

# ============================================================
# Web/Server Configuration
# ============================================================
server.port=8080
server.servlet.context-path=/

# Disable default error mapping for custom error handling
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# ============================================================
# Logging Configuration
# ============================================================
logging.level.root=INFO
logging.level.com.comics=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================================
# Actuator Configuration
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# ============================================================
# Jackson Configuration (JSON serialization)
# ============================================================
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ============================================================
# Swagger/OpenAPI Configuration
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ============================================================
# Application-specific Properties
# ============================================================
# JWT Configuration (when fully implemented)
# app.jwt.secret=your-secret-key-here
# app.jwt.expiration=86400000

# Default page size for pagination
app.pagination.default-size=20
app.pagination.max-size=100
